<!DOCTYPE html>
<html>
<head>
<title>Final Scene 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:black;
  color:white;
  overflow:hidden;
  text-align:center;
}

#box{
  max-width:500px;
}

.heart{
  position:absolute;
  font-size:20px;
  animation:float 3s linear forwards;
}

@keyframes float{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-100vh);opacity:0;}
}

.glow{
  text-shadow:0 0 10px #ff4d6d, 0 0 20px #ff4d6d;
}
</style>
</head>

<body>

<div id="box">
<h2 class="glow">Final Scene 💖</h2>

<p>
Thathi 11th yanna okay kiwwa amma 💖<br><br>

adarei ammi godaaak,<br>
mata kammali ane ada meka hadagena hitiya<br><br>

ummmmmmmmmmmaaaaaaaaaaaa 💖
</p>

<br>
<button onclick="secret()">🔐 secret ending</button>
</div>

<script>

/* 💥 CINEMATIC HEART EXPLOSION */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*window.innerWidth+"px";
  h.style.top=window.innerHeight+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),3000);
},150);

/* 🔐 SECRET ENDING */
function secret(){
  document.body.innerHTML = `
  <div style="color:white;text-align:center">
    <h1 class="glow">💖 Secret Scene Unlocked</h1>
    <p>You were never supposed to click that 😏</p>
    <h2>Always yours 💖</h2>
  </div>`;
}

</script>

</body>
</html>
